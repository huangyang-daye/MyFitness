[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myfitness"
version = "0.1.0"
description = "LangGraph multi-agent health monitoring with Xunji sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
agents = [
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "apscheduler>=3.10.0",
]

[project.scripts]
myfitness = "myfitness.api.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/myfitness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
